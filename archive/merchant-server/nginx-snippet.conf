# 把 /a2m/ 反代到本机 5099 端口的商户服务
# 用法：在 /etc/nginx/sites-enabled/ 里 jeremyai.site 的 server { ... } 块内加入下面两行：
#
#   location /a2m/ {
#       proxy_pass http://127.0.0.1:5099;
#       proxy_set_header Host $host;
#       proxy_set_header X-Real-IP $remote_addr;
#   }
#
# 然后: sudo nginx -t && sudo systemctl reload nginx
#
# 验证: curl -i https://jeremyai.site/a2m/resource  → 应返回 HTTP 402 + Payment-Needed
